<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihon Go - Kotoba Quiz Pertanian</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="d-flex align-items-center gap-3">
    <div class="brand-icon">🍅</div>
    <div>
      <div class="d-flex align-items-center gap-2 flex-wrap"><span class="brand-title">みんなの農業日本語</span><span class="brand-badge">TOMATO</span></div>
      <div class="brand-subtitle">• NIHONGO FARMING QUIZ</div>
    </div>
  </div>
</header>
<main class="container-main">
  <div class="quiz-layout">
    <section class="quiz-card" id="quiz-section">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2 flex-wrap"><span class="badge-chapter" id="chapter">Pertanian</span><span class="badge-category">農業</span></div>
        <span class="question-index" id="question-index">1/79</span>
      </div>
      <h1 class="question-word" id="word">農業</h1>
      <div class="question-reading" id="reading">のうぎょう</div>
      <div class="divider"></div>
      <p class="question-description">Apa artinya dalam Bahasa Indonesia?</p>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="countdown-track"><div class="countdown-bar" id="countdown-bar"></div></div>
      <div class="d-flex justify-content-between mb-2"><small class="text-secondary">Progress latihan</small><small class="text-secondary" id="progress-text">0%</small></div>
      <div class="progress mb-4"><div class="progress-bar" id="progress"></div></div>
    </section>
    <aside class="quiz-sidebar">
      <div class="side-panel statistics-panel">
        <div class="side-panel-heading"><span class="side-icon">▦</span><span>STATISTICS</span></div>
        <div class="stat-card"><div class="stat-label">SOAL DIKERJAKAN</div><div class="stat-number" id="total-question">1</div></div>
        <div class="row g-3"><div class="col-6"><div class="stat-card"><div class="stat-label">BENAR</div><div class="stat-number text-success" id="correct-count">0</div></div></div><div class="col-6"><div class="stat-card"><div class="stat-label">SALAH</div><div class="stat-number text-danger" id="wrong-count">0</div></div></div></div>
      </div>
    </aside>
  </div>
  <section class="result-card d-none" id="result-section">
    <div class="result-title">お疲れ様！</div><h3 class="mt-3">Latihan Selesai!</h3><p class="mt-3" id="final-score"></p><p class="text-secondary" id="final-message"></p><button class="restart-btn mt-3" id="restart">Ulangi Latihan ↻</button>
  </section>
</main>
<script src="vocabulary.js"></script>
<script src="quiz.js"></script>
</body>
</html>
